name: Stage verified Mac package
on:
  push:
    branches: [codex/stage-verified-mac-0819]
permissions:
  actions: read
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45159444422
          name: protocols-0.8.19-mac-candidate
      - name: Stage for updater signing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: allbinbjurstrom/protocols-releases
        run: |
          set -euo pipefail
          test "$(gh release view v0.8.19 --json isDraft --jq .isDraft)" = true
          name=Protocols-0.8.19-Mac-arm64.zip
          if ! gh release view v0.8.19 --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
            gh release upload v0.8.19 "$name"
          fi
          have=$(gh release view v0.8.19 --json assets --jq '.assets[] | select(.name=="Protocols-0.8.19-Mac-arm64.zip") | .digest')
          test "$have" = "sha256:$(sha256sum "$name" | cut -d' ' -f1)"
