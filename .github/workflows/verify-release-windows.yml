name: Verify Protocols Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to verify
        required: true
        type: string
      source_sha256:
        description: SHA-256 of the draft source archive for unit tests (required from 0.8.18)
        required: false
        type: string

permissions:
  contents: write

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: allbinbjurstrom/protocols-releases
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_SHA256: ${{ inputs.source_sha256 }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify frozen source and run Windows unit tests
        if: inputs.source_sha256 != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+[.][0-9]+[.][0-9]+$') { throw 'Invalid release tag' }
          if ($env:SOURCE_SHA256 -notmatch '^[a-f0-9]{64}$') { throw 'Invalid source hash' }
          $name = 'Protocols-' + $env:RELEASE_TAG.Substring(1) + '-source.zip'
          gh release download $env:RELEASE_TAG --pattern $name --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Source download failed' }
          $archive = Join-Path $env:RUNNER_TEMP $name
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:SOURCE_SHA256) { throw 'Source hash mismatch' }
          $sourceDir = Join-Path $env:RUNNER_TEMP 'protocols-unit-source'
          Expand-Archive $archive -DestinationPath $sourceDir
          Set-Location $sourceDir
          $manifest = Get-Content 'SOURCE-MANIFEST.json' -Raw | ConvertFrom-Json
          if ('v' + $manifest.version -ne $env:RELEASE_TAG) { throw 'Source version mismatch' }
          foreach ($file in $manifest.files) {
            if ((Get-FileHash -LiteralPath $file.path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $file.sha256) { throw ('Source file mismatch: ' + $file.path) }
          }
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
          # Use a canonical test root rather than the runner's RUNNER~1 TEMP alias.
          # Native folder selection resolves real paths; raw fixture paths must agree.
          $unitTemp = Join-Path $env:RUNNER_TEMP 'protocols-unit-temp'
          New-Item -ItemType Directory -Path $unitTemp -Force | Out-Null
          $env:TEMP = $unitTemp
          $env:TMP = $unitTemp
          $testFiles = @(Get-ChildItem -LiteralPath 'test' -Filter '*.test.cjs' -File | ForEach-Object { $_.FullName })
          node --test --test-reporter=tap @testFiles 2>&1 | Tee-Object -FilePath 'windows-unit-tests.log'
          $testExit = $LASTEXITCODE
          $counts = @{}
          Get-Content 'windows-unit-tests.log' | ForEach-Object {
            if ($_ -match '^# (tests|pass|fail|skipped) ([0-9]+)$') { $counts[$Matches[1]] = [int]$Matches[2] }
          }
          $result = @{
            version = $manifest.version
            platform = 'win32-x64'
            passed = ($testExit -eq 0)
            command = 'node --test --test-reporter=tap test/*.test.cjs'
            sourceArchiveSha256 = $env:SOURCE_SHA256
            verifiedSourceFiles = $manifest.files.Count
            canonicalTestTemporaryDirectory = $true
            counts = $counts
            workflowRun = ('https://github.com/' + $env:GITHUB_REPOSITORY + '/actions/runs/' + $env:GITHUB_RUN_ID)
          }
          $result | ConvertTo-Json -Depth 10 | Set-Content 'windows-unit-verification.json' -Encoding utf8
          gh release upload $env:RELEASE_TAG 'windows-unit-verification.json' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unit verification upload failed' }
          if ($testExit -ne 0) { throw ('Windows unit tests failed: ' + $testExit) }
      - name: Download and verify installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release tag' }
          $packageDir = Join-Path $env:RUNNER_TEMP 'protocols-package'
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          gh release download $env:RELEASE_TAG --pattern 'Protocols-*-Windows-x64-Setup.exe' --pattern 'update-manifest.json' --dir $packageDir
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          $manifest = Get-Content (Join-Path $packageDir 'update-manifest.json') -Raw | ConvertFrom-Json
          if ('v' + $manifest.version -ne $env:RELEASE_TAG) { throw 'Manifest version differs from tag' }
          if ([version]$manifest.version -ge [version]'0.8.18' -and $env:SOURCE_SHA256 -notmatch '^[a-f0-9]{64}$') { throw 'Source verification is required for this release' }
          $expected = $manifest.files.'win32-x64'
          $installer = Join-Path $packageDir $expected.name
          if ((Get-Item $installer).Length -ne $expected.size) { throw 'Installer size mismatch' }
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected.sha256) { throw 'Installer SHA-256 mismatch' }

      - name: Install and test first start and restart
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = Join-Path $env:RUNNER_TEMP 'protocols-package'
          $manifest = Get-Content (Join-Path $packageDir 'update-manifest.json') -Raw | ConvertFrom-Json
          $installer = Join-Path $packageDir $manifest.files.'win32-x64'.name
          $appDir = Join-Path $env:RUNNER_TEMP 'protocols-installed'
          $installerProcess = Start-Process -FilePath $installer -ArgumentList @('/S', ('/D=' + $appDir)) -PassThru
          if (-not $installerProcess.WaitForExit(180000)) { $installerProcess.Kill(); throw 'Installer timed out' }
          if ($installerProcess.ExitCode -ne 0) { throw ('Installer failed: ' + $installerProcess.ExitCode) }
          $executable = Join-Path $appDir 'Protocols.exe'
          if (-not (Test-Path $executable)) { throw 'Installed executable was not found' }
          Get-Process -Name Protocols -ErrorAction SilentlyContinue | Stop-Process -Force
          $verifyDir = Join-Path $env:RUNNER_TEMP 'protocols-management-verification'
          New-Item -ItemType Directory -Path $verifyDir -Force | Out-Null
          $reports = @()
          $cases = @(
            @{ Name = 'first-run'; Extra = @('--diagnostic-management'); Report = 'VERIFICATION-management.json' },
            @{ Name = 'restart'; Extra = @('--diagnostic-management'); Report = 'VERIFICATION-management.json' }
          )
          if ([version]$manifest.version -ge [version]'0.8.0') {
            $cases = @(
              @{ Name = 'reader'; Extra = @('--diagnostic-reader'); Report = 'READER-VERIFICATION.json' },
              @{ Name = 'reader-restart'; Extra = @('--diagnostic-reader-restart'); Report = 'READER-RESTART-VERIFICATION.json' },
              @{ Name = 'desktop-background'; Extra = @('--diagnostic-desktop-background', '--onenote-background'); Report = 'DESKTOP-BACKGROUND-VERIFICATION.json' }
            )
          }
          if ([version]$manifest.version -ge [version]'0.8.2') {
            $linkedDir = Join-Path $env:RUNNER_TEMP 'protocols-linked-folder-verification'
            $cases += @(
              @{ Name = 'linked-folder'; Dir = $linkedDir; Extra = @('--diagnostic-folder-onenote'); Report = 'LINKED-FOLDER-VERIFICATION.json' },
              @{ Name = 'linked-folder-restart'; Dir = $linkedDir; Extra = @('--diagnostic-folder-onenote', '--diagnostic-folder-restart'); Report = 'LINKED-FOLDER-RESTART.json' }
            )
          }
          if ([version]$manifest.version -ge [version]'0.8.8') {
            foreach ($linked in @($cases | Where-Object { $_.Name -eq 'linked-folder' })) {
              $linked.Extra += '--diagnostic-folder-audit'
            }
            $cases += @(
              @{ Name = 'workbook-grid'; Dir = (Join-Path $env:RUNNER_TEMP 'protocols-grid-verification'); Extra = @('--diagnostic-grid', '--diagnostic-headless'); Report = 'GRID-VERIFICATION.json' },
              @{ Name = 'project-sheet'; Dir = (Join-Path $env:RUNNER_TEMP 'protocols-sheet-verification'); Extra = @('--diagnostic-sheet', '--diagnostic-headless', '--diagnostic-guided'); Report = 'SHEET-VERIFICATION.json' },
              @{ Name = 'project-chat'; Dir = (Join-Path $env:RUNNER_TEMP 'protocols-chat-verification'); Extra = @('--diagnostic-chat', '--diagnostic-headless'); Report = 'CHAT-VERIFICATION.json' }
            )
          }
          if ([version]$manifest.version -ge [version]'0.8.18') {
            $notebookDir = Join-Path $env:RUNNER_TEMP 'protocols-notebook-verification'
            $cases += @(
              @{ Name = 'whole-notebook'; Dir = $notebookDir; Extra = @('--diagnostic-notebook', '--diagnostic-headless'); Report = 'NOTEBOOK-VERIFICATION.json' },
              @{ Name = 'whole-notebook-restart'; Dir = $notebookDir; Extra = @('--diagnostic-notebook', '--diagnostic-notebook-restart', '--diagnostic-headless'); Report = 'NOTEBOOK-RESTART-VERIFICATION.json' }
            )
          }
          foreach ($case in $cases) {
            $phase = $case.Name
            $caseDir = if ($case.Dir) { $case.Dir } else { $verifyDir }
            New-Item -ItemType Directory -Path $caseDir -Force | Out-Null
            $stdout = Join-Path $caseDir ($phase + '.stdout.log')
            $stderr = Join-Path $caseDir ($phase + '.stderr.log')
            $arguments = @('--diagnostic') + $case.Extra + @('--diagnostic-dir="' + $caseDir + '"')
            $testProcess = Start-Process -FilePath $executable -ArgumentList $arguments -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $testProcess.WaitForExit(180000)) { $testProcess.Kill(); Get-Content $stdout; Get-Content $stderr; throw ($phase + ' timed out') }
            Get-Content $stdout
            Get-Content $stderr
            if ($testProcess.ExitCode -ne 0) { throw ($phase + ' failed: ' + $testProcess.ExitCode) }
            $report = Get-Content (Join-Path $caseDir $case.Report) -Raw | ConvertFrom-Json
            if (-not $report.passed -or 'v' + $report.version -ne $env:RELEASE_TAG) { throw ($phase + ' did not pass for the release version') }
            if ($phase -in @('reader', 'reader-restart')) {
              if ($report.preview -or $report.platform -ne 'win32') { throw 'The installed read-only app is not the stable Windows release' }
              if (-not $report.windowsTaskSchedulerTested) { throw 'The actual Windows Task Scheduler was not tested' }
            }
            $reports += @{ phase = $phase; passed = $report.passed; checks = $report.checks }
          }
          $result = @{
            version = $manifest.version
            platform = 'win32-x64'
            runtimeTested = $true
            windowsTaskSchedulerTested = ([version]$manifest.version -ge [version]'0.8.0')
            liveOneNoteTested = $false
            preview = $false
            passed = $true
            installerSha256 = $manifest.files.'win32-x64'.sha256
            workflowRun = ('https://github.com/' + $env:GITHUB_REPOSITORY + '/actions/runs/' + $env:GITHUB_RUN_ID)
            reports = $reports
          }
          $result | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $verifyDir 'windows-runtime-verification.json') -Encoding utf8
          gh release upload $env:RELEASE_TAG (Join-Path $verifyDir 'windows-runtime-verification.json') --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Uploading verification report failed' }
