name: Verify Protocols UI preview

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Preview release tag to verify
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify-preview:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: allbinbjurstrom/protocols-releases
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Download, verify and install the preview
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$') { throw 'Invalid preview tag' }
          $packageDir = Join-Path $env:RUNNER_TEMP 'protocols-preview-package'
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          gh release download $env:RELEASE_TAG --pattern 'Protocols-Preview-*-Windows-x64-Setup.exe' --pattern 'preview-manifest.json' --pattern 'verification-fixtures.zip' --dir $packageDir
          if ($LASTEXITCODE -ne 0) { throw 'Preview download failed' }
          $manifest = Get-Content (Join-Path $packageDir 'preview-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.channel -ne 'preview' -or $manifest.tag -ne $env:RELEASE_TAG) { throw 'Wrong preview channel or tag' }
          if ($manifest.version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid package version' }
          $expected = $manifest.files.'win32-x64'
          if ($expected.name -ne ('Protocols-Preview-' + $manifest.version + '-Windows-x64-Setup.exe')) { throw 'Unexpected installer name' }
          $installer = Join-Path $packageDir $expected.name
          if ((Get-Item $installer).Length -ne $expected.size) { throw 'Installer size mismatch' }
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected.sha256) { throw 'Installer SHA-256 mismatch' }
          $appDir = Join-Path $env:RUNNER_TEMP 'protocols-preview-installed'
          $installerProcess = Start-Process -FilePath $installer -ArgumentList @('/S', ('/D=' + $appDir)) -PassThru
          if (-not $installerProcess.WaitForExit(180000)) { $installerProcess.Kill(); throw 'Installer timed out' }
          if ($installerProcess.ExitCode -ne 0) { throw ('Installer failed: ' + $installerProcess.ExitCode) }
          if (-not (Test-Path (Join-Path $appDir 'Protocols Preview.exe'))) { throw 'Separate preview executable was not found' }
          Get-Process -Name 'Protocols Preview' -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Verify UI, OneNote, Excel and restart
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = Join-Path $env:RUNNER_TEMP 'protocols-preview-package'
          $manifest = Get-Content (Join-Path $packageDir 'preview-manifest.json') -Raw | ConvertFrom-Json
          $executable = Join-Path (Join-Path $env:RUNNER_TEMP 'protocols-preview-installed') 'Protocols Preview.exe'
          $fullDir = Join-Path $env:RUNNER_TEMP 'protocols-preview-full'
          $desktopDir = Join-Path $env:RUNNER_TEMP 'protocols-preview-desktop'
          New-Item -ItemType Directory -Path $fullDir -Force | Out-Null
          Expand-Archive (Join-Path $packageDir 'verification-fixtures.zip') -DestinationPath $fullDir
          $cases = @(
            @{ Name = 'first-run'; Dir = $fullDir; Extra = @('--diagnostic-ai'); Report = 'VERIFICATION-first-run.json' },
            @{ Name = 'restart'; Dir = $fullDir; Extra = @('--diagnostic-ai'); Report = 'VERIFICATION-restart.json' },
            @{ Name = 'import'; Dir = (Join-Path $env:RUNNER_TEMP 'protocols-preview-import'); Extra = @('--diagnostic-import'); Report = 'IMPORT-VERIFICATION.json' },
            @{ Name = 'ui'; Dir = (Join-Path $env:RUNNER_TEMP 'protocols-preview-ui'); Extra = @('--diagnostic-ui', '--diagnostic-ai'); Report = 'UI-VERIFICATION.json' },
            @{ Name = 'management'; Dir = (Join-Path $env:RUNNER_TEMP 'protocols-preview-management'); Extra = @('--diagnostic-management'); Report = 'VERIFICATION-management.json' },
            @{ Name = 'desktop'; Dir = $desktopDir; Extra = @('--diagnostic-desktop'); Report = 'DESKTOP-VERIFICATION.json' },
            @{ Name = 'desktop-background'; Dir = $desktopDir; Extra = @('--diagnostic-desktop-background', '--onenote-background'); Report = 'DESKTOP-BACKGROUND-VERIFICATION.json' }
          )
          if ([version]$manifest.version -ge [version]'0.8.0') {
            $cases = @(
              @{ Name = 'reader'; Dir = $desktopDir; Extra = @('--diagnostic-reader'); Report = 'READER-VERIFICATION.json' },
              @{ Name = 'reader-restart'; Dir = $desktopDir; Extra = @('--diagnostic-reader-restart'); Report = 'READER-RESTART-VERIFICATION.json' },
              @{ Name = 'desktop-background'; Dir = $desktopDir; Extra = @('--diagnostic-desktop-background', '--onenote-background'); Report = 'DESKTOP-BACKGROUND-VERIFICATION.json' }
            )
          }
          $reports = @()
          foreach ($case in $cases) {
            New-Item -ItemType Directory -Path $case.Dir -Force | Out-Null
            $stdout = Join-Path $case.Dir ($case.Name + '.stdout.log')
            $stderr = Join-Path $case.Dir ($case.Name + '.stderr.log')
            $arguments = @('--diagnostic') + $case.Extra + @('--diagnostic-dir="' + $case.Dir + '"')
            $process = Start-Process -FilePath $executable -ArgumentList $arguments -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit(180000)) { $process.Kill(); Get-Content $stdout; Get-Content $stderr; throw ($case.Name + ' timed out') }
            Get-Content $stdout
            Get-Content $stderr
            if ($process.ExitCode -ne 0) { throw ($case.Name + ' failed: ' + $process.ExitCode) }
            $report = Get-Content (Join-Path $case.Dir $case.Report) -Raw | ConvertFrom-Json
            if (-not $report.passed -or $report.version -ne $manifest.version) { throw ($case.Name + ' failed for this version') }
            if ($case.Name -eq 'ui' -and (-not $report.preview -or $report.platform -ne 'win32')) { throw 'UI test did not run the Windows preview' }
            if ($case.Name -in @('desktop', 'reader', 'reader-restart') -and (-not $report.windowsTaskSchedulerTested -or $report.platform -ne 'win32')) { throw 'The actual Windows Task Scheduler was not tested' }
            if ($case.Name -eq 'reader' -and -not $report.preview) { throw 'The installed read-only app is not the preview' }
            $reports += @{ phase = $case.Name; passed = $report.passed; checks = $report.checks }
          }
          $result = @{
            version = $manifest.version
            preview = $true
            platform = 'win32-x64'
            runtimeTested = $true
            windowsTaskSchedulerTested = $true
            liveOneNoteTested = $false
            passed = $true
            installerSha256 = $manifest.files.'win32-x64'.sha256
            workflowRun = ('https://github.com/' + $env:GITHUB_REPOSITORY + '/actions/runs/' + $env:GITHUB_RUN_ID)
            reports = $reports
          }
          $reportFile = Join-Path $packageDir 'windows-preview-verification.json'
          $result | ConvertTo-Json -Depth 10 | Set-Content $reportFile -Encoding utf8
          gh release upload $env:RELEASE_TAG $reportFile --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Uploading verification report failed' }
