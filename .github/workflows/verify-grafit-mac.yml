name: Prepare Protocols Mac package
on:
  push:
    branches: [codex/verify-grafit-0820]
permissions:
  contents: write
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: allbinbjurstrom/protocols-releases
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and verify the release candidate
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          gh release download v0.8.20 -p Protocols-0.8.20-source.zip
          echo '407f56e4419dc5d6cffda50dcc83575d201dc8c3b6cde4d06f6b1f1f0549307d  Protocols-0.8.20-source.zip' | shasum -a 256 -c -
          unzip -q Protocols-0.8.20-source.zip -d src-app
          cd src-app
          npm ci --ignore-scripts --no-audit --no-fund
          node --test test/photo-import-regressions.test.cjs test/folder-runtime.test.cjs test/import-formats.test.cjs
          npm run build:mac -- --publish never
          app=dist/mac-arm64/Protocols.app
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = 0.8.20
          "$app/Contents/MacOS/Protocols" --use-mock-keychain --diagnostic --diagnostic-chat --diagnostic-headless "--diagnostic-dir=$RUNNER_TEMP/grid"
          test "$(jq -r .passed "$RUNNER_TEMP/grid/CHAT-VERIFICATION.json")" = true
          ditto -c -k --sequesterRsrc --keepParent "$app" ../Protocols-0.8.20-Mac-arm64.zip
          gh release upload v0.8.20 ../Protocols-0.8.20-Mac-arm64.zip "$RUNNER_TEMP/grid/CHAT-VERIFICATION.json#Mac app verification"