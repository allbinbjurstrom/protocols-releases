name: Prepare Protocols Mac package
on:
  push:
    branches: [codex/verify-dashboard-0821]
permissions:
  contents: write
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: allbinbjurstrom/protocols-releases
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and verify the release candidate
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          gh release download v0.8.21 -p Protocols-0.8.21-source.zip
          echo 'a746c09048b9b86458958ddb1e7fab5c44e82909015fc6c4bd0baa69b6491192  Protocols-0.8.21-source.zip' | shasum -a 256 -c -
          unzip -q Protocols-0.8.21-source.zip -d src-app
          cd src-app
          npm ci --ignore-scripts --no-audit --no-fund
          node --test test/photo-import-regressions.test.cjs test/folder-runtime.test.cjs test/import-formats.test.cjs
          npm run build:mac -- --publish never
          app=dist/mac-arm64/Protocols.app
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = 0.8.21
          "$app/Contents/MacOS/Protocols" --use-mock-keychain --diagnostic --diagnostic-chat --diagnostic-headless "--diagnostic-dir=$RUNNER_TEMP/grid"
          test "$(jq -r .passed "$RUNNER_TEMP/grid/CHAT-VERIFICATION.json")" = true
          ditto -c -k --sequesterRsrc --keepParent "$app" ../Protocols-0.8.21-Mac-arm64.zip
          gh release upload v0.8.21 ../Protocols-0.8.21-Mac-arm64.zip "$RUNNER_TEMP/grid/CHAT-VERIFICATION.json#Mac app verification"