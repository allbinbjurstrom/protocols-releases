name: Verify folder sync installer and upgrade
on:
  push:
    branches: [codex/verify-folder-upgrade-0819]
permissions:
  contents: read
jobs:
  install-upgrade:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: allbinbjurstrom/protocols-releases
    steps:
      - name: Exercise installed apps with real encrypted project data
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-Location $env:RUNNER_TEMP
          function CheckExit { if($LASTEXITCODE -ne 0){throw "Command failed with $LASTEXITCODE"} }
          function Run($exe,$arguments) {
            $proc=Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
            if(!$proc.WaitForExit(180000)){throw "Process timed out"}
            if($proc.ExitCode -ne 0){throw "Process exited with $($proc.ExitCode)"}
          }
          foreach($version in '0.8.18','0.8.19') {
            $name="Protocols-$version-Windows-x64-Setup.exe"
            gh release download "v$version" -p $name
            CheckExit
            $release=gh release view "v$version" --json assets | ConvertFrom-Json
            $asset=$release.assets | Where-Object name -eq $name
            if(('sha256:'+(Get-FileHash $name).Hash.ToLowerInvariant()) -ne $asset.digest){throw 'Installer hash mismatch'}
          }
          gh release download v0.8.19 -p Protocols-0.8.19-source.zip
          CheckExit
          Expand-Archive Protocols-0.8.19-source.zip -DestinationPath source
          $fixtures=(Resolve-Path source/test/fixtures).Path
          $dest=Join-Path $env:RUNNER_TEMP 'protocols-installed'
          Run '.\Protocols-0.8.18-Windows-x64-Setup.exe' "/S /D=$dest"
          $exe=Join-Path $dest 'Protocols.exe'
          $workspace=Join-Path $env:RUNNER_TEMP 'upgrade-workspace'
          $argsOld="--diagnostic --diagnostic-setup --diagnostic-headless --diagnostic-dir=`"$workspace`" --setup-fixtures=`"$fixtures`""
          Run $exe $argsOld
          $old=Get-Content "$workspace/SETUP-VERIFICATION.json" -Raw | ConvertFrom-Json
          if(!$old.passed -or $old.version -ne '0.8.18'){throw 'Old setup failed'}
          $before=(Get-FileHash "$workspace/workspace.bin").Hash
          Run '.\Protocols-0.8.19-Windows-x64-Setup.exe' '/S --updated'
          if((Get-FileHash "$workspace/workspace.bin").Hash -ne $before){throw 'Installer changed saved workspace'}
          Run $exe "$argsOld --diagnostic-setup-restart"
          $restart=Get-Content "$workspace/SETUP-RESTART.json" -Raw | ConvertFrom-Json
          if(!$restart.passed -or $restart.version -ne '0.8.19'){throw 'New app failed to open old projects'}
          $fresh=Join-Path $env:RUNNER_TEMP 'fresh-workspace'
          Run $exe "--diagnostic --diagnostic-setup --diagnostic-same-folder --diagnostic-headless --diagnostic-dir=`"$fresh`" --setup-fixtures=`"$fixtures`""
          $report=Get-Content "$fresh/SETUP-VERIFICATION.json" -Raw | ConvertFrom-Json
          if(!$report.passed -or $report.version -ne '0.8.19'){throw 'New setup failed'}
          $report.checks
          $restart.checks
